server:
  # 未設 PORT 時用 8080
  port: ${PORT:8080}
  # 讀取 Render 的 X-Forwarded-Proto，讓 Swagger 產生 https 網址。
  forward-headers-strategy: framework

spring:
  application:
    name: benefit-backend
  config:
    import: optional:file:.env[.properties]
  # DB_TYPE=h2 時改走 application-h2.yml
  profiles:
    active: ${DB_TYPE:mssql}

  # 上傳檔案大小上限（收藏照片、爬蟲JSON）
  # 照片的10MB上限會在UseBenefitService另外檢查，這裡抓比較大是給爬蟲JSON用
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Email SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} #環境變數設定在"會員"分頁有註解，不清楚再問群組
    password: ${MAIL_PASSWORD} 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # datasource
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:14330;database=BenefitsJourney;trustServerCertificate=true;
    username: sa
    password: BJourney@2026!

  # jackson
  jackson:
    time-zone: Asia/Taipei

  #JPA
  jpa:
    hibernate:
      #ddl-auto: validate
      ddl-auto: update
    properties:
      hibernate:
        "[column_ordering_strategy]": legacy
        "[use_nationalized_character_data]": true

  # output
  output:
    ansi:
      enabled: always

#JWT
jwt:
    token:
        expire: 30
        secret: "Benefits1234Journey-Secret-Key-2026-Development-10-07-userLoginToken"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

springdoc:
  swagger-ui:
    doc-expansion: none

# Google OAuth Client ID
google:
  #開發用
  client-id: 341264316511-s3ihs3fce68s9e47eimi4ad43m66uegi.apps.googleusercontent.com
  #正式上線用
  #client-id: 667134558874-j0ic603h375aff550icc79pfjjed8nfd.apps.googleusercontent.com

# 初始管理員設定：從環境變數讀取，不在程式碼中寫死帳密
app:
  admin-init:
    account: ${ADMIN_INIT_ACCOUNT:}
    password: ${ADMIN_INIT_PASSWORD:}
    email: ${ADMIN_INIT_EMAIL:}