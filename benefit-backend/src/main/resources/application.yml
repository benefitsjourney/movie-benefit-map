spring:
  application:
    name: benefit-backend

  # Email SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} #環境變數設定在"會員"分頁有註解，不清楚再問群組
    password: ${MAIL_PASSWORD} 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # datasource
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:14330;database=BenefitsJourney;trustServerCertificate=true;
    username: sa
    password: BJourney@2026!

  # jackson
  jackson:
    time-zone: Asia/Taipei

  #JPA
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      #ddl-auto: validate
      ddl-auto: update
    properties:
      hibernate:
        "[column_ordering_strategy]": legacy
        "[use_nationalized_character_data]": true

  # output
  output:
    ansi:
      enabled: always

#JWT
jwt:
    token:
        expire: 30
        secret: "Benefits1234Journey-Secret-Key-2026-Development-10-07-userLoginToken"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

springdoc:
  swagger-ui:
    doc-expansion: none

# 調整持有紀錄照片可上傳大小上限
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# Google OAuth Client ID
google:
  client-id: 341264316511-s3ihs3fce68s9e47eimi4ad43m66uegi.apps.googleusercontent.com
