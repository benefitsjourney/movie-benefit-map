<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BenefitsJourney Tools</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-light">
    <main class="container py-5">
      <h2>BenefitsJourney Tools</h2>
      <p class="text-secondary mb-4">專案開發輔助工具</p>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <!-- 專案根目錄 -->
          <label class="form-label">專案根目錄</label>

          <div class="input-group mb-3">
            <input
              id="project"
              type="text"
              class="form-control"
              placeholder="尚未選擇專案"
              readonly
            />

            <button id="browse" class="btn btn-outline-secondary" type="button">
              選擇
            </button>
          </div>

          <!-- 工具選擇 -->
          <label for="tool" class="form-label">選擇工具</label>
          <select id="tool" class="form-select mb-3"></select>

          <!-- 工具說明 -->
          <div class="bg-light rounded p-3 mb-3">
            <div id="description" class="small mb-2"></div>
            <div id="source" class="small text-secondary text-break"></div>
            <div id="target" class="small text-secondary text-break"></div>
          </div>

          <!-- 執行 -->
          <button id="run" class="btn btn-primary w-100">
            <span
              id="spinner"
              class="spinner-border spinner-border-sm me-2 d-none"
              aria-hidden="true"
            ></span>
            <span id="runText">執行工具</span>
          </button>

          <!-- 執行狀態 -->
          <p
            id="status"
            class="small text-secondary text-center mt-3 mb-0"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/excel-to-sql.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
